  var I2=function(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';};
  var nav=I2('<path d="m3 11 19-9-9 19-2-8-8-2z"/>'),cp=I2('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>');
  return '<div class="md-h"><div><b>Как нас найти</b><div class="fd-s">Пункт выдачи автомобилей</div></div><button class="cb" data-x aria-label="Закрыть">'+ic.x+'</button></div>'+
   (ad?'<a class="fd-map" target="_blank" rel="noopener" href="'+e(mapUrl)+'"><i class="fd-pin"><b></b></i></a>'+
   '<div class="fd-ad"><div><div class="fd-at">'+e(ad)+'</div><div class="fd-s">'+e(D.company||'')+'</div></div><button class="fd-cp" data-cp title="Скопировать адрес">'+cp+'</button></div>':'')+
   '<div class="fd-g">'+(ad?'<a class="fd-b k" target="_blank" rel="noopener" href="'+e(route)+'">'+nav+'Маршрут</a><a class="fd-b" target="_blank" rel="noopener" href="'+e(mapUrl)+'">'+ic.map+'На карте</a>':'')+
   (ph?'<a class="fd-b" href="tel:+'+ph+'">'+ic.tel+'Позвонить</a><a class="fd-b w" target="_blank" rel="noopener" href="https://wa.me/'+ph+'">'+ic.wa+'WhatsApp</a>':'')+'</div>';}
// «Условия аренды и о нас»: по центру экрана, условия — списком с галочками
function infoHtml(mapUrl){var I2=function(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';};
  var ok=I2('<path d="M20 6 9 17l-5-5"/>'),info=I2('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>');
  var lines=String(D.terms||'').replace(/([.;])\s+(?=[А-ЯA-ZЁ])/g,'$1\n').split('\n').map(function(s){return s.trim().replace(/[.;]$/,'');}).filter(Boolean);
  var L=D.logo||{},co=D.company||'';
  var logo=L.sq?'<img alt="" src="'+API+'/logo/sq?v='+L.sq+'">':'<span>'+e((co.trim().charAt(0)||'·').toUpperCase())+'</span>';
  return '<button class="cb in-x" data-x aria-label="Закрыть">'+ic.x+'</button>'+
   '<div class="in-hd"><div class="in-lg">'+logo+'</div><b>'+e(co)+'</b><span>'+(D.terms?'Условия аренды':'О компании')+'</span></div>'+
   (D.about?'<div class="in-sec"><div class="in-t">'+info+'О нас</div><div class="in-ab">'+e(D.about)+'</div></div>':'')+
   (lines.length?'<div class="in-sec"><div class="in-t">'+ic.doc+'Условия аренды</div><ul class="in-ul">'+lines.map(function(x){return '<li><i>'+ok+'</i><span>'+e(x)+'</span></li>';}).join('')+'</ul></div>':'')+
   (D.address?'<a class="in-ad" target="_blank" rel="noopener" href="'+e(mapUrl)+'"><i>'+ic.pin+'</i><span><small>Где забрать машину</small><b>'+e(D.address)+'</b></span><em>'+ic.map+'</em></a>':'')+
   (D.phone?'<div class="in-bt"><a class="fd-b" href="tel:+'+dig(D.phone)+'">'+ic.tel+'Позвонить</a><a class="fd-b w" target="_blank" rel="noopener" href="https://wa.me/'+dig(D.phone)+'">'+ic.wa+'WhatsApp</a></div>':'');}
function closeMd(){if(!MD)return;var el=MD.el;document.removeEventListener('keydown',MD.key);MD=null;el.classList.remove('on');if(!LB)document.documentElement.classList.remove('lk');setTimeout(function(){el.remove();},220);}
window.addEventListener('popstate',function(){if(MD)closeMd();lbClose();});
function fail(){document.getElementById('acts').innerHTML='';document.getElementById('co').textContent='Страница недоступна';
  document.getElementById('app').innerHTML='<div class="err">'+ic.car+'<b>Ссылка недоступна</b>Владелец выключил страницу или выдал новую ссылку.</div>';document.title='Ссылка недоступна';}
// все фото (главные и галерея) загружаются заранее — пока грузятся, показывается экран загрузки
var PRE={done:{},first:true};
function allPhotos(d){var a=[];(d.cars||[]).forEach(function(c){photos(c).forEach(function(u){a.push(u);});});var L=d.logo||{};if(L.sq)a.push(API+'/logo/sq?v='+L.sq);if(L.wide)a.push(API+'/logo/wide?v='+L.wide);return a;}
function preload(urls,cb){var need=urls.filter(function(u){return !PRE.done[u];}),n=need.length,k=0,fin=false;
  function end(){if(fin)return;fin=true;cb();}
  if(!n){end();return;}
  function one(){k++;ldProg(k,n);if(k>=n)end();}
  need.forEach(function(u){var im=new Image();im.onload=im.onerror=function(){PRE.done[u]=1;one();};im.decoding='async';im.src=u;});
  setTimeout(end,20000);}
function ldShow(){if(document.getElementById('ld'))return;var el=document.createElement('div');el.id='ld';el.innerHTML='<div class="ld-c"><div class="ld-r"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19"/><circle class="p" cx="22" cy="22" r="19"/></svg>'+ic.car+'</div><b>Загружаем автопарк</b><span id="ldt">фотографии машин…</span></div>';document.body.appendChild(el);}
function ldProg(k,n){var p=document.querySelector('#ld .p'),s=document.getElementById('ldt');if(p)p.style.strokeDashoffset=String(119.4*(1-k/n));if(s)s.textContent='фото '+k+' из '+n;}
function ldHide(){var el=document.getElementById('ld');if(!el)return;el.classList.add('out');setTimeout(function(){el.remove();},350);}
function load(){if(!TOKEN){fail();return;}if(PRE.first)ldShow();fetch(API,{cache:'no-store'}).then(function(r){if(r.status===404){D=null;ldHide();fail();return null;}return r.json();}).then(function(j){if(!(j&&j.ok))return;
  if(PRE.first){PRE.first=false;preload(allPhotos(j),function(){D=j;draw();setTimeout(ldHide,250);});}
  else preload(allPhotos(j),function(){D=j;draw();});}).catch(function(){if(PRE.first){PRE.first=false;ldHide();}});}
load();setInterval(function(){if(!LB&&!MD)load();},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!LB&&!MD)load();});
})();
</script></body></html>
